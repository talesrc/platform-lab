gatewayClass:
  name: envoy
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

gateway:
  name: platform
  # Which namespaces may attach HTTPRoutes is least-privilege per listener:
  # - http: only this release's namespace (the HTTP->HTTPS redirect), or also the
  #   platform namespaces when https is disabled
  # - https: only the namespaces of `routes` below (derived, so it can't drift)
  # - appsListener: namespaces labelled by the apps ApplicationSet (allowedRoutes below)
  # Otherwise a tenant could attach a route for a platform hostname (e.g. argocd.lab.localhost)
  # to the http or https listener.
  # nodePorts must match the kind extraPortMappings (terraform/kind-cluster: ingress_node_ports).
  http:
    port: 80
    nodePort: 30080
  https:
    enabled: true
    port: 443
    nodePort: 30443
    hostname: "*.lab.localhost"
    # Wildcard certificate issued by cert-manager (see gitops/manifests/cert-manager-issuers).
    certificate:
      secretName: platform-gateway-tls
      issuerRef:
        kind: ClusterIssuer
        name: platform-ca
      dnsNames:
        - "*.lab.localhost"
  # Second HTTPS listener for workloads (apps/<name> -> <name>.apps.lab.localhost).
  # Shares the https port; needs https.enabled. A separate certificate is needed
  # because a wildcard only covers one label (*.lab.localhost != x.apps.lab.localhost).
  appsListener:
    enabled: true
    # HTTPRoutes of apps attach with parentRefs[].sectionName = this name.
    name: https-apps
    hostname: "*.apps.lab.localhost"
    # Which namespaces may attach routes. Gateway API can't match a name prefix
    # (app-*), so app namespaces are selected by the label the apps ApplicationSet
    # puts on every namespace it creates (gitops/manifests/app-tenancy).
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            app.kubernetes.io/part-of: apps
    certificate:
      secretName: platform-gateway-apps-tls
      issuerRef:
        kind: ClusterIssuer
        name: platform-ca
      dnsNames:
        - "*.apps.lab.localhost"
  # Redirect every plain-HTTP request (platform and apps hosts) to HTTPS
  # (only when https.enabled).
  redirectHttpToHttps: true

# Services exposed through the gateway. Routes attach to the https listener
# when it is enabled, otherwise to http.
# - name: argocd
#   namespace: argocd
#   hostname: argocd.lab.localhost
#   service: argocd-server
#   port: 80
routes: []
