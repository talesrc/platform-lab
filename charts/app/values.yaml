# Defaults are the golden path; an app usually sets image, port and probes only.
# Validated by values.schema.json (e.g. a pinned image tag is required, `latest` is rejected).

# Resource names and the app.kubernetes.io/name label; defaults to the release name, which
# Argo CD sets to the app directory name (apps/<name>).
nameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Overrides the image's ENTRYPOINT / CMD. Note: setting `args` replaces CMD, so images whose
# binary is in CMD (no ENTRYPOINT) also need `command`.
command: []
args: []
# Plain env vars: config only. Anything secret goes in secretEnv or generatedSecretEnv (git is
# public; CI rejects secret-looking names here).
env: {}

# Env vars whose values live in Vault, one secret per env var at
# secret/apps/<name>/<env>/<ENV_VAR> (field `value`). The ExternalSecret <name>-secrets syncs
# them into the Secret <name>-secrets; the container gets each one through secretKeyRef.
# Values are never in git: owners write them in Vault (see docs/apps.md, Secrets).
secretEnv: []

# Env vars with random values nobody types or sees, made by an External Secrets Password
# generator once (refreshPolicy: CreatedOnce) into the Secret <name>-generated. Rotate one by
# deleting that Secret, then restart the Deployment.
#   SESSION_KEY: { length: 32 }
generatedSecretEnv: {}

secrets:
  # Vault KV path (mount secret/) of this app and environment, apps/<name>/<env>. Set by the
  # apps ApplicationSet; a Kyverno policy only admits ExternalSecrets for the namespace's own path.
  vaultPath: ""
  # ClusterSecretStore that reads secret/apps/* (gitops/manifests/platform-secrets).
  store: vault-apps
  # How often External Secrets re-reads Vault. Env vars are read at start-up: after a value
  # changes, restart the Deployment to use it.
  refreshInterval: 5m

replicas: 1

# Container port, named "http"; the Service exposes it on service.port.
port: 8080
service:
  port: 80

probes:
  readiness:
    path: /readyz
    periodSeconds: 10
  liveness:
    path: /healthz
    periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Pod identity: non-root with a numeric UID so runAsNonRoot can be verified.
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# The root filesystem is read-only; each path here gets a writable emptyDir.
writablePaths:
  - /tmp

# https://<name>.apps.lab.localhost on the platform gateway's https-apps listener.
route:
  enabled: true
  hostname: ""

# Prometheus scrapes service.port at this path (kube-prometheus-stack watches all namespaces).
metrics:
  enabled: true
  path: /metrics
  interval: 30s

# Service level objectives over 30 days, per environment, with burn-rate alerts (a
# PrometheusRule; needs metrics.enabled). They read the request histogram the app exposes on
# metrics.path; the defaults fit podinfo-style instrumentation (http_request_duration_seconds
# with `status` and `path` labels). An app without such a histogram sets slo.enabled: false.
slo:
  enabled: true
  # Histogram name, without the _bucket/_count suffix.
  metric: http_request_duration_seconds
  # PromQL label matchers for the requests that count; the default leaves out probes and
  # Prometheus' own scrapes, which would otherwise be most of a quiet app's traffic.
  selector: 'path!~"healthz|readyz|metrics"'
  availability:
    enabled: true
    # Percent of requests that must not fail.
    objective: 99.5
    # Matchers for a failed request.
    errorSelector: 'status=~"5.."'
  latency:
    enabled: true
    # Percent of requests that must be faster than `le`.
    objective: 99
    # A bucket boundary of the histogram, in seconds, written as Prometheus stores it
    # (0.5, 1.0, 2.5: whole numbers keep their ".0").
    le: "0.5"

# Created only when replicas > 1 (a PDB on a single replica would block node drains).
podDisruptionBudget:
  minAvailable: 1
