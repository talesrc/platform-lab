{{- if .Values.route.enabled }}
# Attaches to the shared gateway's apps listener (only namespaces labelled by the apps
# ApplicationSet may attach there).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
      sectionName: https-apps
  hostnames:
    - {{ .Values.route.hostname | default (printf "%s.apps.lab.localhost" (include "app.name" .)) | quote }}
  rules:
    - backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
