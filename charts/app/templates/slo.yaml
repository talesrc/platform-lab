{{- /*
Default SLOs from the request histogram the ServiceMonitor scrapes, with multi-window,
multi-burn-rate alerts (Google SRE workbook, "Alerting on SLOs") for a 30-day SLO period:

  fast burn, severity critical: 14.4x over 1h and 5m, or 6x over 6h and 30m (2% / 5% of the
                                month's budget gone in that hour / those six hours)
  slow burn, severity warning:  3x over 1d and 2h (10% of the budget in a day)

The workbook's fourth alert (1x over 3d) needs 3 days of data; Prometheus keeps 2.

Recorded per app and environment (labels namespace, job = app, slo = availability|latency):
  slo:sli_error:ratio_rate<window>  share of bad requests over the window
  slo:error_budget:ratio            1 - objective
Burn rate = error ratio / error budget; the promotion check reads both.
*/ -}}
{{- if and .Values.metrics.enabled .Values.slo.enabled }}
{{- $slo := .Values.slo }}
{{- $name := include "app.name" . }}
{{- $ns := .Release.Namespace }}
{{- $matchers := printf "namespace=%q, job=%q" $ns $name }}
{{- if $slo.selector }}{{ $matchers = printf "%s, %s" $matchers $slo.selector }}{{ end }}
{{- $total := printf "sum by (namespace, job) (rate(%s_count{%s}[WINDOW]))" $slo.metric $matchers }}
{{- $slis := list }}
{{- with $slo.availability }}
{{- if .enabled }}
{{- $bad := printf "sum by (namespace, job) (rate(%s_count{%s, %s}[WINDOW]))" $slo.metric $matchers .errorSelector }}
{{- /* No error series at all means no errors: `or 0 * total` keeps the ratio at 0. */}}
{{- $slis = append $slis (dict "name" "availability" "title" "Availability" "objective" .objective
      "ratio" (printf "(%s or 0 * %s) / %s" $bad $total $total)
      "what" "requests fail") }}
{{- end }}
{{- end }}
{{- with $slo.latency }}
{{- if .enabled }}
{{- $good := printf "sum by (namespace, job) (rate(%s_bucket{%s, le=%q}[WINDOW]))" $slo.metric $matchers .le }}
{{- /* A `le` that matches no bucket counts every request as slow: loud, not silent. */}}
{{- $slis = append $slis (dict "name" "latency" "title" "Latency" "objective" .objective
      "ratio" (printf "1 - (%s or 0 * %s) / %s" $good $total $total)
      "what" (printf "requests take longer than %ss" .le)) }}
{{- end }}
{{- end }}
{{- if $slis }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}-slo
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  groups:
    {{- range $slis }}
    {{- $sli := . }}
    {{- $sel := printf "{namespace=%q, job=%q, slo=%q}" $ns $name .name }}
    {{- $budget := printf "(1 - %v / 100)" .objective }}
    - name: {{ $name }}-slo-{{ .name }}
      rules:
        {{- range list "5m" "30m" "1h" "2h" "6h" "1d" }}
        - record: slo:sli_error:ratio_rate{{ . }}
          expr: {{ replace "WINDOW" . $sli.ratio | quote }}
          labels:
            slo: {{ $sli.name }}
        {{- end }}
        - record: slo:error_budget:ratio
          expr: vector{{ $budget }}
          labels:
            namespace: {{ $ns }}
            job: {{ $name }}
            slo: {{ .name }}
        - alert: {{ .title }}ErrorBudgetBurn
          expr: >-
            (slo:sli_error:ratio_rate1h{{ $sel }} > 14.4 * {{ $budget }}
            and slo:sli_error:ratio_rate5m{{ $sel }} > 14.4 * {{ $budget }})
            or
            (slo:sli_error:ratio_rate6h{{ $sel }} > 6 * {{ $budget }}
            and slo:sli_error:ratio_rate30m{{ $sel }} > 6 * {{ $budget }})
          for: 2m
          labels:
            severity: critical
            slo: {{ .name }}
          annotations:
            summary: {{ printf "%s is burning its %s error budget fast" $name .name | quote }}
            description: >-
              {{ printf "%s in %s: %s at 6x or more the rate the %v%% %s objective allows; at this rate the 30-day error budget is gone in 5 days or less. Check recent deploys and roll back if one caused it." $name $ns .what .objective .name }}
        - alert: {{ .title }}ErrorBudgetBurn
          expr: >-
            slo:sli_error:ratio_rate1d{{ $sel }} > 3 * {{ $budget }}
            and slo:sli_error:ratio_rate2h{{ $sel }} > 3 * {{ $budget }}
          for: 15m
          labels:
            severity: warning
            slo: {{ .name }}
          annotations:
            summary: {{ printf "%s is burning its %s error budget" $name .name | quote }}
            description: >-
              {{ printf "%s in %s: %s at 3x or more the rate the %v%% %s objective allows, over the last day; at this rate the 30-day error budget is gone in about 10 days." $name $ns .what .objective .name }}
    {{- end }}
{{- end }}
{{- end }}
