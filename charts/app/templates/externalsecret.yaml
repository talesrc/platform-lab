{{- /*
Secrets from Vault (secretEnv): one Vault secret per env var at
secret/<secrets.vaultPath>/<ENV_VAR>, field `value`, synced into the Secret <name>-secrets.
A missing Vault secret leaves the ExternalSecret (and the Argo CD app) Degraded and the pod
unable to start, which is why promotion checks prd's secrets first.
*/}}
{{- with .Values.secretEnv }}
{{- $vaultPath := required "secrets.vaultPath is required with secretEnv (the apps ApplicationSet sets apps/<name>/<env>)" $.Values.secrets.vaultPath | trimSuffix "/" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" $ }}-secrets
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secrets.store }}
  target:
    name: {{ include "app.name" $ }}-secrets
    creationPolicy: Owner
  data:
    {{- range . }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $vaultPath }}/{{ . }}
        property: value
    {{- end }}
{{- end }}
{{- /*
Generated secrets (generatedSecretEnv): a Password generator per env var, run once
(refreshPolicy: CreatedOnce) into the Secret <name>-generated. Nobody types or sees the values.
*/}}
{{- with .Values.generatedSecretEnv }}
{{- range $name, $options := . }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "app.generatorName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  {{- /* No symbols by default: values often end up in URLs and shell-quoted config. */}}
  {{- toYaml (merge (deepCopy ($options | default dict)) (dict "length" 32 "digits" 6 "symbols" 0 "noUpper" false "allowRepeat" true)) | nindent 2 }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" $ }}-generated
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  # Generate once: a refresh would replace the values under the running app.
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "app.name" $ }}-generated
    creationPolicy: Owner
  # Each generator's output key is `password`; rewrite renames it to the env var.
  dataFrom:
    {{- range $name, $_ := . }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "app.generatorName" (dict "root" $ "name" $name) }}
      rewrite:
        - regexp:
            source: ^password$
            target: {{ $name }}
    {{- end }}
{{- end }}
