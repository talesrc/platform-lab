# Exercises secrets: env vars from Vault (secretEnv) and generated ones (generatedSecretEnv).
# No values here, only names: the values live in Vault or are generated in the cluster.
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.15.0"
port: 9898
env:
  EXAMPLE: "true"
secretEnv: [EXAMPLE_API_TOKEN]
generatedSecretEnv:
  EXAMPLE_SESSION_KEY: { length: 48 }
  EXAMPLE_CSRF_KEY: {}
secrets:
  # Set by the apps ApplicationSet in the cluster.
  vaultPath: apps/example/stg
