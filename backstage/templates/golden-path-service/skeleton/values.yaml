# Values for the golden-path chart (charts/app/values.yaml documents every option), shared by
# every environment. Per environment (envs/<env>/):
#   values.yaml   environment config: what differs between stg and prd (URLs, replicas, ...)
#   release.yaml  the release: image tag, release-scoped env vars and the env vars it requires;
#                 promotion ("Promote to prd" in Backstage) copies it from stg to prd.
# https://${{ values.name }}.apps.lab.localhost (prd), https://${{ values.name }}-stg.apps.lab.localhost (stg)
app:
  image:
    repository: ${{ values.image }}
  port: ${{ values.port }}
  probes:
    readiness:
      path: ${{ values.readinessPath }}
    liveness:
      path: ${{ values.livenessPath }}
  metrics:
    path: ${{ values.metricsPath }}
  resources:
    requests:
      cpu: ${{ values.cpuRequest }}
      memory: ${{ values.memoryRequest }}
    limits:
      memory: ${{ values.memoryLimit }}
