apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/part-of: apps
spec:
  replicas: ${{ values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/part-of: apps
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ values.name }}
          image: ${{ values.image }}:${{ values.tag }}
          ports:
            - name: http
              containerPort: ${{ values.port }}
          readinessProbe:
            httpGet:
              path: ${{ values.readinessPath }}
              port: http
          livenessProbe:
            httpGet:
              path: ${{ values.livenessPath }}
              port: http
          resources:
            requests:
              cpu: ${{ values.cpuRequest }}
              memory: ${{ values.memoryRequest }}
            limits:
              memory: ${{ values.memoryLimit }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
