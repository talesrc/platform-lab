apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/apps/${{ values.name }}
    # Docs tab: mkdocs.yml + docs/ in this directory.
    backstage.io/techdocs-ref: dir:.
    # Live state on the entity page: pods (Kubernetes), sync/health (Argo CD), dashboards (Grafana).
    backstage.io/kubernetes-namespace: app-${{ values.name }}
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=${{ values.name }}'
    argocd/app-name: ${{ values.name }}
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
    # Kyverno results on the entity page (Policy Reporter): the app's Deployment.
    kyverno.io/resource-name: ${{ values.name }}
    kyverno.io/kind: Deployment
  links:
    - url: https://${{ values.name }}.apps.lab.localhost
      title: ${{ values.name }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: platform-lab
  dependsOn:
    - component:platform-gateway
    - resource:default/platform-lab-cluster
