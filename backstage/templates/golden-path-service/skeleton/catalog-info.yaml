apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/apps/${{ values.name }}
    # Live state on the entity page: pods (Kubernetes), sync/health (Argo CD), dashboards (Grafana).
    backstage.io/kubernetes-namespace: app-${{ values.name }}
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=${{ values.name }}'
    argocd/app-name: ${{ values.name }}
    grafana/dashboard-selector: "title @> 'Compute Resources / Namespace'"
  links:
    - url: https://${{ values.name }}.apps.lab.localhost
      title: ${{ values.name }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: platform-lab
  dependsOn:
    - component:platform-gateway
