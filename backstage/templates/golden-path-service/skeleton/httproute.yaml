apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/part-of: apps
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
      sectionName: https-apps
  hostnames:
    - ${{ values.name }}.apps.lab.localhost
  rules:
    - backendRefs:
        - name: ${{ values.name }}
          port: 80
