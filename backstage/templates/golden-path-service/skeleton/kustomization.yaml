# Deployed by the apps ApplicationSet into namespace app-${{ values.name }}.
# catalog-info.yaml is for Backstage only and deliberately not listed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-${{ values.name }}
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml
