apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-service
  title: Golden-path service
  description: >-
    A containerized HTTP service on the platform, in stg and prd: Deployment, Service, HTTPS
    route at <name>.apps.lab.localhost (prd) and <name>-stg.apps.lab.localhost (stg) and
    Prometheus scraping. Opens a pull request to platform-lab; merging it deploys the service
    to both environments through Argo CD.
  tags: [recommended, kubernetes, gitops]
spec:
  owner: group:platform-team
  type: service
  system: platform-lab

  parameters:
    - title: Service
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          description: DNS label; becomes apps/<name>, namespaces app-<name>-stg and app-<name>-prd, and <name>.apps.lab.localhost.
          pattern: "^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: A service on the platform-lab golden path.
        owner:
          title: Owner
          type: string
          default: group:platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
    - title: Container
      required: [image, tag, port]
      properties:
        image:
          title: Image (without tag)
          type: string
          default: ghcr.io/stefanprodan/podinfo
        tag:
          title: Tag
          type: string
          description: >-
            A pinned version, deployed to stg and prd; later versions go to stg first and are
            promoted to prd. `latest` is rejected by the platform policies.
          default: "6.15.0"
          pattern: "^(?!latest$)[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
        port:
          title: Container port
          type: integer
          default: 9898
        metricsPath:
          title: Prometheus metrics path
          type: string
          default: /metrics
        readinessPath:
          title: Readiness probe path
          type: string
          default: /readyz
        livenessPath:
          title: Liveness probe path
          type: string
          default: /healthz
    - title: Resources
      properties:
        replicas:
          title: Replicas
          description: Per environment (envs/<env>/values.yaml); change prd's later as needed.
          type: integer
          default: 1
          minimum: 1
          maximum: 3
        cpuRequest:
          title: CPU request
          type: string
          default: 50m
        memoryRequest:
          title: Memory request
          type: string
          default: 64Mi
        memoryLimit:
          title: Memory limit
          type: string
          default: 128Mi
    # Names only: values never pass through this form (the scaffolder keeps task parameters).
    - title: Secrets
      properties:
        secretEnv:
          title: Secrets from Vault
          description: >-
            Env vars whose values you write in Vault yourself, e.g. third-party API keys. Each
            one is read from apps/<name>/<env>/<ENV_VAR> (field `value`) in stg and prd; the
            app starts once they are there. Names only, never values.
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        generatedSecretEnv:
          title: Generated secrets
          description: >-
            Env vars with random values (session or signing keys) that External Secrets
            generates once per environment; nobody types or sees them.
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  steps:
    - id: fetch
      name: Render app (golden-path chart + values)
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: apps/${{ parameters.name }}
        values:
          name: ${{ parameters.name }}
          # Version of charts/app (oci://ghcr.io/talesrc/charts/app) new apps start on.
          chartVersion: 0.4.0
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          image: ${{ parameters.image }}
          tag: ${{ parameters.tag }}
          port: ${{ parameters.port }}
          metricsPath: ${{ parameters.metricsPath }}
          readinessPath: ${{ parameters.readinessPath }}
          livenessPath: ${{ parameters.livenessPath }}
          replicas: ${{ parameters.replicas }}
          cpuRequest: ${{ parameters.cpuRequest }}
          memoryRequest: ${{ parameters.memoryRequest }}
          memoryLimit: ${{ parameters.memoryLimit }}
          secretEnv: ${{ parameters.secretEnv }}
          generatedSecretEnv: ${{ parameters.generatedSecretEnv }}

    - id: publish
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=talesrc&repo=platform-lab
        branchName: apps/add-${{ parameters.name }}
        title: "feat(apps): add ${{ parameters.name }}"
        commitMessage: "feat(apps): add ${{ parameters.name }}"
        description: |
          Adds `apps/${{ parameters.name }}` from the golden-path template.

          Merging deploys it through the apps ApplicationSet to stg (namespace
          `app-${{ parameters.name }}-stg`, https://${{ parameters.name }}-stg.apps.lab.localhost)
          and prd (namespace `app-${{ parameters.name }}-prd`,
          https://${{ parameters.name }}.apps.lab.localhost).
          {% if parameters.secretEnv | length %}
          Secrets to write in Vault before the app can start (field `value`, never in git):
          {%- for name in parameters.secretEnv %}
          - `apps/${{ parameters.name }}/stg/${{ name }}` and `apps/${{ parameters.name }}/prd/${{ name }}`
          {%- endfor %}

          After merging, re-apply `terraform/platform-access` so the owner's Vault policy covers
          `apps/${{ parameters.name }}/`.
          {% endif %}

    # Keeps the PR link in the creator's notifications after they leave this page. Argo CD
    # notifies the owner again once the merged app is deployed (gitops/manifests/app-tenancy).
    - id: notify
      name: Notify you
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ user.ref }}
        title: "${{ parameters.name }}: pull request ready for review"
        info: Merge it to deploy ${{ parameters.name }} to stg and prd (https://${{ parameters.name }}.apps.lab.localhost).
        link: ${{ steps['publish'].output.remoteUrl }}
        topic: golden-path
        # A notification failure must not fail a run whose pull request already exists.
        optional: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: prd URL (after merge)
        url: https://${{ parameters.name }}.apps.lab.localhost
      - title: stg URL (after merge)
        url: https://${{ parameters.name }}-stg.apps.lab.localhost
      - title: Secrets in Vault
        url: https://vault.lab.localhost/ui/vault/secrets/secret/kv/list/apps/${{ parameters.name }}/
