# platform-lab production config, baked into the image. Secrets come from env vars
# (Kubernetes Secrets from terraform/platform-addons, terraform/platform-access and
# CloudNativePG); nothing secret lives here.
app:
  title: platform-lab
  baseUrl: https://backstage.lab.localhost

organization:
  name: TALECO

backend:
  baseUrl: https://backstage.lab.localhost
  # Object form, like app-config.yaml: mixing it with the ':7007' string form fails at
  # startup ("Invalid type in config for key 'backend.listen'").
  listen:
    port: 7007
  cors:
    origin: https://backstage.lab.localhost
  # PostgreSQL from CloudNativePG (cluster backstage-db, gitops/platform/backstage.yaml);
  # the env vars come from its generated backstage-db-app Secret. One database, one schema
  # per plugin: the app user owns the database but may not create new ones.
  database:
    client: pg
    pluginDivisionMode: schema
    ensureSchemaExists: true
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
  auth:
    # Static tokens for platform tools that call Backstage (terraform/platform-addons
    # generates them), each limited to the one plugin it needs.
    externalAccess:
      # Argo CD Notifications -> POST /api/notifications (deploy, sync failure, degraded).
      - type: static
        options:
          token: ${ARGOCD_NOTIFICATIONS_TOKEN}
          subject: argocd-notifications
        accessRestrictions:
          - plugin: notifications
          # ... and POST /api/dora/deploys (prd deploys, packages/backend/src/plugins/dora).
          - plugin: dora
      # Alertmanager -> POST /api/alertmanager/webhook (packages/backend/src/plugins), and
      # POST /api/dora/alerts (prd failures for the DORA metrics).
      - type: static
        options:
          token: ${ALERTMANAGER_TOKEN}
          subject: alertmanager
        accessRestrictions:
          - plugin: alertmanager
          - plugin: dora

integrations:
  github:
    - host: github.com
      # Fine-grained PAT (Contents + Pull requests on platform-lab); optional.
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  providers:
    # OAuth App callback: https://backstage.lab.localhost/api/auth/github/handler/frame
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # GitHub login `talesrc` -> catalog User `user:default/talesrc` (catalog-info.yaml).
            # Users without a matching User entity cannot sign in.
            - resolver: usernameMatchingUserEntityName

catalog:
  # Be gentle with GitHub's API rate limit.
  processingInterval:
    minutes: 10
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  locations:
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/backstage/templates/golden-path-service/template.yaml
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/backstage/templates/promote-app/template.yaml
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/backstage/templates/rollback-app/template.yaml

# --- Platform visibility (IDP phase 1) --------------------------------------------------
# Tokens come from the backstage-platform-access Secret (terraform/platform-access); all
# traffic stays in-cluster.

# Pods, deployments, restarts, errors and logs per entity, via the pod's service account
# (read-only ClusterRole in gitops/platform/backstage.yaml). Entities select their objects
# with backstage.io/kubernetes-label-selector (+ backstage.io/kubernetes-namespace).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: platform-lab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

# Argo CD sync status, health and history per entity (annotation argocd/app-name).
argocd:
  baseUrl: https://argocd.lab.localhost
  appLocatorMethods:
    - type: config
      instances:
        - name: platform-lab
          url: http://argocd-server.argocd.svc
          token: ${ARGOCD_AUTH_TOKEN}

# Grafana dashboards per entity (annotation grafana/dashboard-selector; it supports only
# ==, !=, &&, || and `tags @> 'x'`, so match titles exactly). The alerts card is disabled
# in app-config.yaml. The browser calls Backstage's proxy; the Viewer token is added
# server-side and never reaches the browser.
proxy:
  endpoints:
    /grafana/api:
      target: http://kube-prometheus-stack-grafana.monitoring.svc
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

grafana:
  hosts:
    - id: platform-lab
      domain: https://grafana.lab.localhost
      proxyPath: /grafana/api
      unifiedAlerting: true

# --- TechDocs (IDP phase 2) -------------------------------------------------------------
# Docs-as-code: an entity with `backstage.io/techdocs-ref: dir:.` gets a Docs tab rendered
# from the mkdocs.yml + docs/ next to its catalog-info.yaml. Backstage fetches the sources
# from GitHub (integrations.github) and builds them with mkdocs-techdocs-core, installed in
# the image (/opt/mkdocs, see packages/backend/Dockerfile) - no Docker-in-Docker.
# The local publisher keeps generated sites on the pod's filesystem: they are rebuilt on
# first view after a restart (fine for the lab; production would publish to object storage
# with builder: external and generate the docs in CI).
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

# --- Standards (IDP phase 4) --------------------------------------------------------------
# Scorecards (Tech Insights), Kyverno results (Policy Reporter) and the permission policy
# (packages/backend/src/plugins/permissionPolicy.ts).

permission:
  enabled: true

techInsights:
  # Facts are stored in PostgreSQL (the tech_insights schema); keep two weeks of history.
  factRetrievers:
    entityOwnershipFactRetriever:
      cadence: '*/30 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    entityMetadataFactRetriever:
      cadence: '*/30 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    techdocsFactRetriever:
      cadence: '*/30 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    # packages/backend/src/plugins/techInsightsPlatformLab.ts; reads Chart.yaml files from
    # GitHub, so it runs less often to stay within the API rate limit.
    platformLabFactRetriever:
      cadence: '0 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    # packages/backend/src/plugins/appSecretsFacts.ts: Vault metadata of apps' secrets.
    appSecretsFactRetriever:
      cadence: '30 * * * *'
      lifecycle: { timeToLive: { weeks: 2 } }
    # packages/backend/src/plugins/dora/techInsights.ts: DORA metrics over 30 days, kept a
    # year so the trend is visible.
    doraFactRetriever:
      cadence: '15 */6 * * *'
      lifecycle: { timeToLive: { weeks: 52 } }
  factChecker:
    checks:
      ownedByTeam:
        type: json-rules-engine
        name: Owned by a team
        description: spec.owner is a Group, so alerts and ownership don't depend on one person.
        factIds: [entityOwnershipFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasGroupOwner
                operator: equal
                value: true
      hasDescription:
        type: json-rules-engine
        name: Has a description
        description: metadata.description explains what the component is.
        factIds: [entityMetadataFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasDescription
                operator: equal
                value: true
      hasTechDocs:
        type: json-rules-engine
        name: Has docs
        description: backstage.io/techdocs-ref points at the component's docs (TechDocs).
        factIds: [techdocsFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasAnnotationBackstageIoTechdocsRef
                operator: equal
                value: true
      hasLiveState:
        type: json-rules-engine
        name: Shows live state
        description: >-
          Kubernetes (backstage.io/kubernetes-label-selector) and Argo CD (argocd/app-name, or
          argocd/app-selector for an app in several environments) annotations, so the entity
          page shows its pods and sync status.
        factIds: [platformLabFactRetriever]
        filter:
          kind: component
          spec.type: service
        rule:
          conditions:
            all:
              - fact: hasKubernetesSelector
                operator: equal
                value: true
              - fact: hasArgocdApp
                operator: equal
                value: true
      hasLinks:
        type: json-rules-engine
        name: Has links
        description: metadata.links points at the running service or its UI.
        factIds: [platformLabFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasLinks
                operator: equal
                value: true
      prdNotBehindStg:
        type: json-rules-engine
        name: prd keeps up with stg
        description: >-
          prd runs stg's release, or stg's newer release is at most 14 days old. Promote it
          (Create → Promote to prd) or, if it shouldn't reach prd, fix stg.
        factIds: [platformLabFactRetriever]
        filter:
          kind: component
          spec.type: service
        rule:
          conditions:
            all:
              - fact: prdBehindDays
                operator: lessThanInclusive
                value: 14
      onLatestGoldenPathChart:
        type: json-rules-engine
        name: On the latest golden-path chart
        description: >-
          apps/<name>/Chart.yaml depends on the newest charts/app version (merge Renovate's
          chart-upgrade pull request). Only golden-path apps are checked.
        factIds: [platformLabFactRetriever]
        filter:
          kind: component
          spec.type: service
        rule:
          conditions:
            all:
              - fact: usesLatestAppChart
                operator: equal
                value: true
      secretsPresent:
        type: json-rules-engine
        name: Secrets in Vault
        description: >-
          Every secret stg and prd use (secretEnv) is in Vault at apps/<name>/<env>/<ENV_VAR>.
          A missing one keeps the app from starting; the Releases card links to where to write it.
        factIds: [appSecretsFactRetriever]
        filter:
          kind: component
          spec.type: service
        rule:
          conditions:
            all:
              - fact: secretsMissing
                operator: equal
                value: 0
      secretsRotated:
        type: json-rules-engine
        name: Secrets rotated in 90 days
        description: >-
          Every secret in use was written to Vault in the last 90 days. Rotate the oldest one
          (the Releases card shows each secret's age), then restart the app to pick it up.
        factIds: [appSecretsFactRetriever]
        filter:
          kind: component
          spec.type: service
        rule:
          conditions:
            all:
              - fact: oldestSecretDays
                operator: lessThanInclusive
                value: 90

# --- Releases -----------------------------------------------------------------------------
# platform-lab:app:promote (packages/backend/src/plugins/scaffolderPromote.ts) checks stg
# before promoting: Synced, Healthy and on the release's image in Argo CD (argocd.* above),
# deployed at least stgSoakMinutes ago, no SLO burning its error budget faster than
# stgMaxBurnRate over the last 30 minutes (charts/app SLO rules), and no warning/critical
# alert firing in its namespace.
# The same check, every readyNotification.everyMinutes, tells the owner when prd is behind a
# stg release that passes it (packages/backend/src/plugins/readyToPromote.ts), once per release.
platformLab:
  promotion:
    stgSoakMinutes: 10
    prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
    stgMaxBurnRate: 1
    alertmanagerUrl: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
    readyNotification:
      enabled: true
      everyMinutes: 5
  # App secrets (packages/backend/src/plugins/vaultSecrets.ts): Vault metadata only, through
  # the `backstage` Kubernetes auth role (terraform/platform-access/app-secrets.tf) with the
  # projected token from gitops/platform/backstage.yaml. Promotion refuses a release whose
  # secrets prd lacks; the Releases card shows each secret per environment.
  vault:
    url: http://vault.vault.svc:8200
    mount: secret
    role: backstage
    tokenPath: /var/run/secrets/vault/token
    uiUrl: https://vault.lab.localhost
