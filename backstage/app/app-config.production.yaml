# platform-lab production config, baked into the image. Secrets come from env vars
# (Kubernetes Secrets created by terraform/platform-addons); nothing secret lives here.
app:
  title: platform-lab
  baseUrl: https://backstage.lab.localhost

organization:
  name: TALECOs

backend:
  baseUrl: https://backstage.lab.localhost
  # Object form, like app-config.yaml: mixing it with the ':7007' string form fails at
  # startup ("Invalid type in config for key 'backend.listen'").
  listen:
    port: 7007
  cors:
    origin: https://backstage.lab.localhost
  # Lab: in-memory SQLite, no database to run; the catalog is rebuilt from git on restart.
  database:
    client: better-sqlite3
    connection: ':memory:'

integrations:
  github:
    - host: github.com
      # Fine-grained PAT (Contents + Pull requests on platform-lab); optional.
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  providers:
    # OAuth App callback: https://backstage.lab.localhost/api/auth/github/handler/frame
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # GitHub login `talesrc` -> catalog User `user:default/talesrc` (catalog-info.yaml).
            # Users without a matching User entity cannot sign in.
            - resolver: usernameMatchingUserEntityName

catalog:
  # Be gentle with GitHub's API rate limit.
  processingInterval:
    minutes: 10
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  locations:
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/talesrc/platform-lab/blob/main/backstage/templates/golden-path-service/template.yaml

# --- Platform visibility (IDP phase 1) --------------------------------------------------
# Tokens come from the backstage-platform-access Secret (terraform/platform-access); all
# traffic stays in-cluster.

# Pods, deployments, restarts, errors and logs per entity, via the pod's service account
# (read-only ClusterRole in gitops/platform/backstage.yaml). Entities select their objects
# with backstage.io/kubernetes-label-selector (+ backstage.io/kubernetes-namespace).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: platform-lab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

# Argo CD sync status, health and history per entity (annotation argocd/app-name).
argocd:
  baseUrl: https://argocd.lab.localhost
  appLocatorMethods:
    - type: config
      instances:
        - name: platform-lab
          url: http://argocd-server.argocd.svc
          token: ${ARGOCD_AUTH_TOKEN}

# Grafana dashboards per entity (annotation grafana/dashboard-selector; it supports only
# ==, !=, &&, || and `tags @> 'x'`, so match titles exactly). The alerts card is disabled
# in app-config.yaml. The browser calls Backstage's proxy; the Viewer token is added
# server-side and never reaches the browser.
proxy:
  endpoints:
    /grafana/api:
      target: http://kube-prometheus-stack-grafana.monitoring.svc
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

grafana:
  hosts:
    - id: platform-lab
      domain: https://grafana.lab.localhost
      proxyPath: /grafana/api
      unifiedAlerting: true
