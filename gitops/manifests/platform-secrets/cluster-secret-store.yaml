# Vault as a cluster-wide secret store for External Secrets. ESO logs in with its own
# service account (Vault's Kubernetes auth method, role `external-secrets`), which only
# grants read access to secret/platform-lab/* (terraform/platform-access).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # Short-lived token for this audience only; the Vault role requires it.
            audiences:
              - vault
