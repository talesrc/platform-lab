# Vault as a cluster-wide secret store for External Secrets. ESO logs in with its own
# service account (Vault's Kubernetes auth method), one Vault role per store
# (terraform/platform-access):
#   vault       role external-secrets: reads secret/platform-lab/* (platform services);
#   vault-apps  role external-secrets-apps: reads secret/apps/* (golden-path apps).
# `conditions` limits which namespaces may use each store, so a tenant can't point an
# ExternalSecret at the platform's secrets. Within app-* namespaces, the Kyverno policy
# restrict-app-externalsecrets admits only the namespace's own path, apps/<name>/<env>/.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  conditions:
    - namespaces: [backstage]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # Short-lived token for this audience only; the Vault role requires it.
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-apps
spec:
  conditions:
    # Namespaces of the apps ApplicationSet: app-<name>-<env>.
    - namespaceRegexes: ["^app-[a-z0-9-]+-(stg|prd)$"]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-apps
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - vault
