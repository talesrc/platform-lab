# Sample ExternalSecrets for `kyverno test` (not applied to the cluster).

# What the golden-path chart renders for hello in stg: its own Vault path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: own-path
  namespace: app-hello-stg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-apps
  target:
    name: hello-secrets
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: apps/hello/stg/API_TOKEN
        property: value
---
# Generated values only (no store).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: generated
  namespace: app-my-api-prd
spec:
  refreshPolicy: CreatedOnce
  target:
    name: my-api-generated
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: my-api-session-key
---
# prd's path from stg.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: other-env
  namespace: app-hello-stg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-apps
  target:
    name: hello-secrets
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: apps/hello/prd/API_TOKEN
        property: value
---
# Another app's path whose name starts like this one's (apps/hello-admin vs apps/hello).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: other-app
  namespace: app-hello-stg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-apps
  target:
    name: hello-secrets
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: apps/hello-admin/stg/API_TOKEN
        property: value
---
# The platform store (Backstage's GitHub token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-store
  namespace: app-hello-stg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: stolen
  dataFrom:
    - extract:
        key: platform-lab/backstage/github
---
# Every key under the app path at once (find); listing keys explicitly is required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: find
  namespace: app-hello-stg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-apps
  target:
    name: hello-secrets
  dataFrom:
    - find:
        path: apps/
        name:
          regexp: ".*"
---
# Platform namespaces are out of scope (the store's conditions guard those).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github
  namespace: backstage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: backstage-github
  dataFrom:
    - extract:
        key: platform-lab/backstage/github
