# Run from the repo root:  kyverno test gitops/manifests/kyverno-policies/tests
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
  - ../require-requests-limits.yaml
  - ../disallow-latest-tag.yaml
  - ../require-app-name-label.yaml
  - ../restrict-app-externalsecrets.yaml
resources:
  - resources.yaml
  - externalsecrets.yaml
results:
  - policy: restrict-app-externalsecrets
    isValidatingPolicy: true
    kind: ExternalSecret
    resources: [app-hello-stg/own-path, app-my-api-prd/generated]
    result: pass
  - policy: restrict-app-externalsecrets
    isValidatingPolicy: true
    kind: ExternalSecret
    resources: [app-hello-stg/other-env, app-hello-stg/other-app, app-hello-stg/platform-store, app-hello-stg/find]
    result: fail
  - policy: restrict-app-externalsecrets
    isValidatingPolicy: true
    kind: ExternalSecret
    resources: [backstage/backstage-github]
    result: skip
  - policy: require-requests-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/compliant, team-a/compliant-digest, team-a/latest-tag, team-a/untagged, team-a/unlabeled]
    result: pass
  - policy: require-requests-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/no-resources, team-a/init-without-limit]
    result: fail
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/compliant, team-a/compliant-digest, team-a/no-resources, team-a/init-without-limit, team-a/unlabeled]
    result: pass
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/latest-tag, team-a/untagged]
    result: fail
  - policy: require-app-name-label
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/compliant, team-a/compliant-digest, team-a/no-resources, team-a/init-without-limit, team-a/latest-tag, team-a/untagged]
    result: pass
  - policy: require-app-name-label
    isValidatingPolicy: true
    kind: Pod
    resources: [team-a/unlabeled]
    result: fail
  # Excluded platform namespace: every policy skips it.
  - policy: require-requests-limits
    isValidatingPolicy: true
    kind: Pod
    resources: [kube-system/platform-pod]
    result: skip
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources: [kube-system/platform-pod]
    result: skip
  - policy: require-app-name-label
    isValidatingPolicy: true
    kind: Pod
    resources: [kube-system/platform-pod]
    result: skip
