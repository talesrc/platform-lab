apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-app-externalsecrets
  annotations:
    policies.kyverno.io/title: Restrict App ExternalSecrets
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ExternalSecret
    policies.kyverno.io/description: >-
      Golden-path apps read secrets only from their own Vault path. In namespace
      app-<name>-<env>, an ExternalSecret may use the vault-apps ClusterSecretStore with keys
      under apps/<name>/<env>/, and External Secrets generators; nothing else. The store's
      Vault role can read every app's path (secret/apps/*), so this policy is what keeps one
      tenant out of another's secrets.
spec:
  # Deny, unlike the Audit-mode best-practice policies: this is a security boundary. It only
  # matches ExternalSecrets in app namespaces, so failing closed blocks nothing else.
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  matchConditions:
    # Namespaces of the apps ApplicationSet (gitops/manifests/app-tenancy/applicationset.yaml).
    - name: app-namespaces
      expression: request.namespace.matches('^app-[a-z0-9-]+-(stg|prd)$')
  variables:
    # app-hello-stg -> apps/hello/stg/
    - name: env
      expression: request.namespace.substring(request.namespace.lastIndexOf('-') + 1)
    - name: app
      expression: request.namespace.substring(4, request.namespace.lastIndexOf('-'))
    - name: prefix
      expression: "'apps/' + variables.app + '/' + variables.env + '/'"
  validations:
    - expression: >-
        !has(object.spec.secretStoreRef) ||
        (has(object.spec.secretStoreRef.kind) &&
        object.spec.secretStoreRef.kind == 'ClusterSecretStore' &&
        object.spec.secretStoreRef.name == 'vault-apps')
      message: App ExternalSecrets use the ClusterSecretStore vault-apps.
    - expression: >-
        !has(object.spec.data) ||
        object.spec.data.all(d, !has(d.sourceRef) && d.remoteRef.key.startsWith(variables.prefix))
      messageExpression: >-
        'App ExternalSecrets in ' + request.namespace + ' read keys under ' +
        variables.prefix + ' only.'
    - expression: >-
        !has(object.spec.dataFrom) ||
        object.spec.dataFrom.all(d, has(d.sourceRef) && has(d.sourceRef.generatorRef) &&
        !has(d.sourceRef.storeRef) && !has(d.extract) && !has(d.find))
      message: >-
        dataFrom is for generators only in app namespaces; list each Vault key under data
        (the golden-path chart does, from secretEnv).
