apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-app-name-label
  annotations:
    policies.kyverno.io/title: Require app.kubernetes.io/name Label
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must carry the recommended app.kubernetes.io/name label so they can be grouped
      in dashboards, cost reports and the developer portal. Checking Pods covers every
      workload type (Deployments, StatefulSets, Jobs, ...) through their pod templates.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    # Platform/system namespaces; keep in sync with gitops/platform/kyverno-pod-security.yaml.
    - name: exclude-platform-namespaces
      expression: >-
        !(request.namespace in ['kube-system', 'kube-public', 'kube-node-lease',
        'local-path-storage', 'kyverno', 'argocd', 'cert-manager', 'envoy-gateway-system',
        'platform-gateway', 'monitoring'])
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] != ''
      message: The label app.kubernetes.io/name is required.
