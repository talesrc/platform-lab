# One Application per app and environment: apps/<name>/ (a golden-path Helm app) is deployed
# once per environment as <name>-<env>, into namespace app-<name>-<env>, under the restricted
# `apps` project. Each environment renders the shared values.yaml plus
# envs/<env>/values.yaml (environment config) and envs/<env>/release.yaml (the release, which
# promotion copies from stg to prd).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # The environments, in promotion order. hostSuffix: prd keeps <name>.apps.lab.localhost.
          - list:
              elements:
                - env: stg
                  hostSuffix: "-stg"
                - env: prd
                  hostSuffix: ""
          - git:
              repoURL: https://github.com/talesrc/platform-lab.git
              revision: main
              directories:
                - path: apps/*
  # Default policy (sync): removing apps/<name>/ deletes its Applications and, through the
  # resources finalizer below, their resources, so git stays the source of truth. If git can't
  # be read, the generator errors and existing Applications are left untouched.
  # preserveResourcesOnDeletion: false = deleting this ApplicationSet also removes the
  # tenants' resources (fine for a lab; set true to keep workloads running).
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{ .path.basename }}-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: apps
        # The catalog Component (Argo CD Notifications and Backstage find the app by these).
        platform-lab/tenant: "{{ .path.basename }}"
        platform-lab/environment: "{{ .env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: https://github.com/talesrc/platform-lab.git
        targetRevision: main
        path: "{{ .path.path }}"
        helm:
          # Same resource names (and app.kubernetes.io/name) in every environment.
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - envs/{{ .env }}/values.yaml
            - envs/{{ .env }}/release.yaml
          # Platform conventions per environment, not left to the app's values.
          valuesObject:
            app:
              route:
                hostname: "{{ .path.basename }}{{ .hostSuffix }}.apps.lab.localhost"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{ .path.basename }}-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: apps
            platform-lab/tenant: "{{ .path.basename }}"
            platform-lab/environment: "{{ .env }}"
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
