apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/talesrc/platform-lab.git
    targetRevision: main
    path: charts/platform-gateway
    helm:
      valuesObject:
        routes:
          - name: argocd
            namespace: argocd
            hostname: argocd.lab.localhost
            service: argocd-server
            port: 80
          - name: grafana
            namespace: monitoring
            hostname: grafana.lab.localhost
            service: kube-prometheus-stack-grafana
            port: 80
          - name: prometheus
            namespace: monitoring
            hostname: prometheus.lab.localhost
            service: kube-prometheus-stack-prometheus
            port: 9090
          - name: alertmanager
            namespace: monitoring
            hostname: alertmanager.lab.localhost
            service: kube-prometheus-stack-alertmanager
            port: 9093
          - name: backstage
            namespace: backstage
            hostname: backstage.lab.localhost
            service: backstage
            port: 7007
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
