# Backstage developer portal: software catalog + golden-path templates.
# Image: ghcr.io/talesrc/platform-lab-backstage, built from backstage/app.
# The namespace and the optional GitHub Secrets are created by terraform/platform-addons.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.10.2
    helm:
      valuesObject:
        backstage:
          # Our own image, built from backstage/app by .github/workflows/backstage-image.yaml.
          # Pin a sha-<commit> tag; the lab config is baked in (app-config.production.yaml).
          image:
            registry: ghcr.io
            repository: talesrc/platform-lab-backstage
            tag: sha-461b264
          # Same as the image's CMD; the chart appends its (empty) generated config last.
          args:
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000 # "node" in the image
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Secrets created by terraform/platform-addons (never in git). All optional, so the
          # pod starts without them: no token = read-only portal, no OAuth app = no sign-in.
          extraEnvVars:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-github
                  key: GITHUB_TOKEN
                  optional: true
            - name: AUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-github-oauth
                  key: AUTH_GITHUB_CLIENT_ID
                  optional: true
            - name: AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-github-oauth
                  key: AUTH_GITHUB_CLIENT_SECRET
                  optional: true
            # Argo CD (read-only account) and Grafana (Viewer) tokens for the entity pages,
            # created by terraform/platform-access.
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-platform-access
                  key: ARGOCD_AUTH_TOKEN
                  optional: true
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-platform-access
                  key: GRAFANA_TOKEN
                  optional: true
          # The configuration lives in the image (backstage/app/app-config.production.yaml).
          appConfig: {}
        # Identity of the Kubernetes plugin (authProvider: serviceAccount, in-cluster token).
        serviceAccount:
          create: true
          name: backstage
          automountServiceAccountToken: true
        # Read-only access to the workload objects the Kubernetes plugin shows, cluster-wide.
        # No Secrets: configmaps are the most sensitive thing it can read.
        extraDeploy:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: backstage-kubernetes-read
            rules:
              - apiGroups: [""]
                resources: [pods, pods/log, services, configmaps, limitranges, resourcequotas]
                verbs: [get, list, watch]
              - apiGroups: [apps]
                resources: [deployments, replicasets, statefulsets, daemonsets]
                verbs: [get, list, watch]
              - apiGroups: [autoscaling]
                resources: [horizontalpodautoscalers]
                verbs: [get, list, watch]
              - apiGroups: [networking.k8s.io]
                resources: [ingresses]
                verbs: [get, list, watch]
              - apiGroups: [batch]
                resources: [jobs, cronjobs]
                verbs: [get, list, watch]
              - apiGroups: [metrics.k8s.io]
                resources: [pods]
                verbs: [get, list]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: backstage-kubernetes-read
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: backstage-kubernetes-read
            subjects:
              - kind: ServiceAccount
                name: backstage
                namespace: backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
