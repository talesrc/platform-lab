# The Vault ClusterSecretStore and the ExternalSecrets that produce platform Secrets
# (gitops/manifests/platform-secrets). Last wave on purpose: until terraform/platform-access
# has configured Vault (auth method, policy, values), the store and the ExternalSecrets
# report errors and this app is Degraded; in the last wave that can't block anything.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/talesrc/platform-lab.git
    targetRevision: main
    path: gitops/manifests/platform-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
