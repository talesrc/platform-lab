# Platform guardrails (resources, image tags, labels), in Audit mode.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/talesrc/platform-lab.git
    targetRevision: main
    # Directory sources don't recurse by default, so tests/ (the `kyverno test`
    # suite) is never applied. (`directory: {recurse: false}` would be dropped by
    # the API server as a default and leave the root app OutOfSync.)
    path: gitops/manifests/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
