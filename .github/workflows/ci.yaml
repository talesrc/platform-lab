name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: "1.16.5"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.3.0"
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.8.0"
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: "v1.19.1"
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=@commitlint/cli
  COMMITLINT_VERSION: "21.2.3"
  # renovate: datasource=pypi depName=pyyaml
  PYYAML_VERSION: "6.0.3"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate (every root module)
        run: |
          for dir in terraform/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  manifests:
    name: Helm & Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo CHECKSUMS "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install PyYAML
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Lint charts, render them and validate all manifests
        run: scripts/ci/validate-manifests.sh

  policies:
    name: Kyverno policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kyverno CLI
        run: |
          base="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
          archive="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLo checksums.txt "${base}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c
          tar xzf "${archive}" kyverno
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: kyverno test (every kyverno-test.yaml under gitops/)
        run: kyverno test gitops/
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install PyYAML
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Golden path (every apps/* passes all lab policies)
        run: scripts/ci/check-app-policies.sh

  environments:
    name: App environments (stg → prd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit, to tell which release.yaml files a pull request changes.
          fetch-depth: 0
      - name: Install PyYAML
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "pyyaml==${PYYAML_VERSION}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Releases, required env vars and promotion order
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/check-app-envs.py ${BASE_SHA:+--base "${BASE_SHA}"}

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install --no-save "@commitlint/cli@${COMMITLINT_VERSION}" "@commitlint/config-conventional@${COMMITLINT_VERSION}"
      - name: Lint PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLo checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c
          tar xzf "${archive}" actionlint
      - name: actionlint
        run: '"${RUNNER_TEMP}/actionlint" -color'
