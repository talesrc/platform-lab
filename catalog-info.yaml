# Backstage software catalog for platform-lab (loaded from this file on main).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns and runs platform-lab.
spec:
  type: team
  children: []
  members: [talesrc]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: talesrc
spec:
  profile:
    displayName: Tales Ribeiro
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platform-lab
  description: Local internal developer platform on kind, bootstrapped by Terraform and run by Argo CD.
  annotations:
    github.com/project-slug: talesrc/platform-lab
    # Platform docs: mkdocs.yml + docs/ at the repository root (Docs tab).
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/talesrc/platform-lab
      title: Repository
spec:
  owner: group:platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd
  title: Argo CD
  description: GitOps controller; syncs gitops/platform (app-of-apps) and the apps.
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/terraform/platform-addons
    backstage.io/kubernetes-namespace: argocd
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=argocd'
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
  links:
    - url: https://argocd.lab.localhost
      title: Argo CD UI
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: envoy-gateway
  title: Envoy Gateway
  description: Gateway API implementation; the controller behind the shared platform Gateway.
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/gitops/platform
    backstage.io/kubernetes-namespace: envoy-gateway-system
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=envoy-gateway'
    argocd/app-name: envoy-gateway
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-gateway
  title: Platform Gateway
  description: Shared HTTPS entrypoint (*.lab.localhost) with wildcard TLS and per-service routes.
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/charts/platform-gateway
    backstage.io/kubernetes-namespace: envoy-gateway-system
    backstage.io/kubernetes-label-selector: 'gateway.envoyproxy.io/owning-gateway-name=platform'
    argocd/app-name: platform-gateway
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
  dependsOn:
    - component:envoy-gateway
    - component:cert-manager
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cert-manager
  title: cert-manager
  description: Issues TLS certificates from the lab CA (platform-ca ClusterIssuer).
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/gitops/manifests/cert-manager-issuers
    backstage.io/kubernetes-namespace: cert-manager
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=cert-manager'
    argocd/app-name: cert-manager
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kyverno
  title: Kyverno
  description: Policy engine; platform guardrails in Audit mode.
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/gitops/manifests/kyverno-policies
    backstage.io/kubernetes-namespace: kyverno
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=kyverno'
    argocd/app-name: kyverno
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kube-prometheus-stack
  title: Observability
  description: Prometheus, Alertmanager and Grafana (plus metrics-server for kubectl top).
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/gitops/platform
    backstage.io/kubernetes-namespace: monitoring
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance'
    argocd/app-name: kube-prometheus-stack
    grafana/dashboard-selector: "tags @> 'kubernetes-mixin'"
  links:
    - url: https://grafana.lab.localhost
      title: Grafana
    - url: https://prometheus.lab.localhost
      title: Prometheus
    - url: https://alertmanager.lab.localhost
      title: Alertmanager
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: registry-cache
  title: Registry cache
  description: Pull-through image caches for the kind nodes (Docker, outside the cluster).
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/terraform/registry-cache
spec:
  type: platform-service
  lifecycle: production
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  title: Backstage
  description: This developer portal (catalog + golden-path templates).
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/backstage
    backstage.io/kubernetes-namespace: backstage
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/instance=backstage'
    argocd/app-name: backstage
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
  links:
    - url: https://backstage.lab.localhost
      title: Backstage
spec:
  type: website
  lifecycle: experimental
  owner: group:platform-team
  system: platform-lab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: podinfo
  title: podinfo
  description: Reference application on the golden path (apps/podinfo).
  annotations:
    backstage.io/source-location: url:https://github.com/talesrc/platform-lab/tree/main/apps/podinfo
    # Declared here, not in apps/podinfo, so `dir:.` would mean the repo root: point at its folder.
    backstage.io/techdocs-ref: url:https://github.com/talesrc/platform-lab/tree/main/apps/podinfo
    # Every environment (app-podinfo-stg, app-podinfo-prd): pods by label, Argo CD apps by tenant.
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=podinfo'
    argocd/app-selector: platform-lab/tenant=podinfo
    grafana/dashboard-selector: "title == 'Kubernetes / Compute Resources / Namespace (Workloads)' || title == 'Kubernetes / Compute Resources / Namespace (Pods)'"
    # Kyverno results on the entity page (Policy Reporter): the app's Deployment in prd.
    kyverno.io/resource-name: podinfo
    kyverno.io/kind: Deployment
    kyverno.io/namespace: app-podinfo-prd
  links:
    - url: https://podinfo.apps.lab.localhost
      title: podinfo (prd)
    - url: https://podinfo-stg.apps.lab.localhost
      title: podinfo (stg)
    # The "Promote to prd" template with this service filled in.
    - url: https://backstage.lab.localhost/create/templates/default/promote-app?formData=%7B%22app%22%3A%22component%3Adefault%2Fpodinfo%22%7D
      title: Promote stg to prd
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: platform-lab
  dependsOn:
    - component:platform-gateway
    - resource:default/platform-lab-cluster
---
# Every golden-path app registers itself: Backstage expands this glob through its GitHub
# integration, so apps/<name>/catalog-info.yaml shows up once merged to main.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: platform-lab-apps
  description: Catalog entries of every app under apps/
spec:
  type: url
  targets:
    - https://github.com/talesrc/platform-lab/blob/main/apps/*/catalog-info.yaml
---
# The lab's Kubernetes cluster. Golden-path apps depend on it; the Policy Reporter plugin reads
# Kyverno results from the API in kyverno.io/endpoint (gitops/platform/policy-reporter.yaml).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: platform-lab-cluster
  title: platform-lab cluster (kind)
  description: The kind cluster every platform component and golden-path app runs on.
  annotations:
    kyverno.io/endpoint: http://policy-reporter.policy-reporter.svc:8080/
spec:
  type: kubernetes-cluster
  owner: group:platform-team
  system: platform-lab
