# https://podinfo.apps.lab.localhost — attaches to the shared gateway's apps listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
      sectionName: https-apps
  hostnames:
    - podinfo.apps.lab.localhost
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
