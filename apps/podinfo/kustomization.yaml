# Golden-path sample app (see README "Apps"). The ApplicationSet deploys every
# apps/<name>/ into namespace app-<name>, served at https://<name>.apps.lab.localhost.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-podinfo

labels:
  - pairs:
      app.kubernetes.io/part-of: apps
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - httproute.yaml
  - servicemonitor.yaml
