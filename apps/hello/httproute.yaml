apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: apps
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
      sectionName: https-apps
  hostnames:
    - hello.apps.lab.localhost
  rules:
    - backendRefs:
        - name: hello
          port: 80
